name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Installs Gradle itself, so no gradlew / wrapper files are needed in the repo.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug and release APKs
        run: gradle --no-daemon assembleDebug assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GalleryX-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK (signed with debug key, installable)
        uses: actions/upload-artifact@v4
        with:
          name: GalleryX-release
          path: app/build/outputs/apk/release/*.apk
